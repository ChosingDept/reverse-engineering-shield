name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning .agents/skills/reverse-engineering-shield/scripts/audit.sh tests/run.sh install.sh
      - name: Tests
        run: bash tests/run.sh
      - name: Installer dry run
        run: bash install.sh --dry-run
